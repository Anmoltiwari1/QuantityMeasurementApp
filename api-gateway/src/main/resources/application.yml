server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Origin"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/auth/**, /login/**, /oauth2/**
        - id: quantity-service
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/api/**
